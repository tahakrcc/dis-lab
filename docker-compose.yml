services:
  postgres:
    image: postgres:16
    container_name: kopru-postgres
    environment:
      POSTGRES_DB: kopru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kopru"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
